services:
  mysql:
    image: mysql:8.0
    container_name: opspilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: opspilot
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: opspilot
      DB_PASSWORD: opspilot_secret
      DB_NAME: opspilot
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Used during Next.js static build — browser uses localhost:8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: opspilot-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # SSR fetches use this to reach the backend within the Docker network
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data:
